<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Move preview · Project: Duel Synapse</title>
<link rel="stylesheet" href="./arena.css">
<link rel="stylesheet" href="./meiocg.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; place-items: center; background: radial-gradient(800px 500px at 50% 0, #1d2563, transparent 70%), #0c0f1f; }
  :root { --z: min(calc((100vw - 24px) / 7.6), calc((100vh - 70px) / 5.9)); --zh: var(--z); --ch: calc(var(--z) * .92); --cw: calc(var(--ch) * 59 / 86); }
  .stage { display: grid; gap: 10px; justify-items: center; }
  .mat { transform: perspective(1200px) rotateX(12deg); }
  .cap { font: 600 13px var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: #f0b429; }
</style>
</head>
<body>
<div class="stage">
  <div class="cap" id="cap">Preview</div>
  <div id="field" class="mat"></div>
</div>
<script type="module">
import { runFinisher, zoneStrike, STYLES } from "./finisher.js";
import { entrance, attack, ENTRANCES, ATTACKS } from "./moves.js";
import { finale, ace, staple, SHOWS, SHOW_NAMES, pickShow } from "./cardfx.js";
const f = document.getElementById("field");
const KINDS = ["effect", "spell", "trap", "fusion", "synchro", "xyz", "link", "normal"];
const NAMES = ["Synapse Dragon", "Meta Field", "Insider Trap", "Fusion Core", "Tuner Wing", "Rank Knight", "Link Circuit", "Duelist"];
let k = 0;
const card = () => { const c = document.createElement("div"); c.className = "card"; const s = document.createElement("span"); const i = k++ % 8; s.className = "nm stand " + KINDS[i]; s.innerHTML = `<b>${NAMES[i]}</b><i>${1000 + 300 * i} / ${800 + 200 * i}</i>`; c.append(s); return c; };
const back = () => { const c = document.createElement("div"); c.className = "card back"; return c; };
function zone(row, col, cls, fill) {
  const z = document.createElement("div"); z.className = "zone " + cls; z.style.gridRow = row + 1; z.style.gridColumn = col + 1;
  if (fill) z.append(fill()); f.append(z); return z;
}
function build() {
  f.replaceChildren(); k = 0;
  zone(0, 0, "op pile", back); for (let i = 1; i < 6; i++) zone(0, i, "op sz", i % 2 ? back : null); zone(0, 6, "op pile", back);
  zone(1, 0, "op pile", card); for (let i = 1; i < 6; i++) zone(1, i, "op mz", i !== 3 ? card : null); zone(1, 6, "op sz", null);
  zone(2, 0, "op pile", null).id = "op-banished"; zone(2, 2, "emz", null); const sig = zone(2, 4, "emz", card); sig.firstChild.dataset.side = "op"; zone(2, 6, "me pile", null).id = "me-banished";
  zone(3, 0, "me sz", null); for (let i = 1; i < 6; i++) zone(3, i, "me mz", i === 2 || i === 4 ? card : null); zone(3, 6, "me pile", card);
  zone(4, 0, "me pile", back); for (let i = 1; i < 6; i++) zone(4, i, "me sz", i === 3 ? back : null); zone(4, 6, "me pile", back);
  return sig;
}
// #shatter (a finishing move), #entrance:portal or #attack:beam
// #shatter (a finishing move), #entrance:portal, #attack:beam, #finale:rush, #finale:domain:5000 (ms), #ace:radiant, #ace:random,
// #staple:Ash Blossom & Joyous Spring
const h = decodeURIComponent(location.hash.slice(1));
let [kind, name] = h.includes(":") ? [h.slice(0, h.indexOf(":")), h.slice(h.indexOf(":") + 1)] : ["finish", h];
let showMs = 0;
if ((kind === "finale" || kind === "ace") && /:\d+$/.test(name)) { showMs = Number(name.slice(name.lastIndexOf(":") + 1)); name = name.slice(0, name.lastIndexOf(":")); }
const randomShow = (kind === "finale" || kind === "ace") && name === "random";
const style = kind === "entrance" ? (ENTRANCES.includes(name) ? name : "rise") : kind === "attack" ? (ATTACKS.includes(name) ? name : "lunge")
  : kind === "finale" ? (SHOWS.includes(name) ? name : "menacing") : kind === "ace" ? (SHOWS.includes(name) ? name : "spotlight") : kind === "staple" ? name : STYLES.includes(name) ? name : "shatter";
document.getElementById("cap").textContent = (randomShow ? "Random" : SHOW_NAMES[style] || style) + ({ entrance: " · entrance", attack: " · attack", finale: " · winning attack", ace: " · Ace card", staple: "" }[kind] ?? " · finishing move");
const demoArt = () => { const c = document.createElement("canvas"); c.width = 236; c.height = 344; const g = c.getContext("2d"), gr = g.createLinearGradient(0, 0, 236, 344); gr.addColorStop(0, "#3347f0"); gr.addColorStop(.6, "#7a4fd6"); gr.addColorStop(1, "#f0b429"); g.fillStyle = gr; g.fillRect(0, 0, 236, 344); g.fillStyle = "#ffffffcc"; g.font = "bold 120px sans-serif"; g.textAlign = "center"; g.fillText("★", 118, 220); return c.toDataURL(); };
async function loopShow() {
  for (;;) {
    build();
    await wait(400);
    const st = randomShow ? pickShow("random", Math.random() * 1e9) : style;
    if (randomShow) document.getElementById("cap").textContent = "Random · " + SHOW_NAMES[st];
    if (kind === "finale") { await finale(st, { ms: showMs, src: demoArt(), title: "Your Ace Card", line: "the winning blow" }); await wait(500); }
    else if (kind === "ace") { await ace(st, { src: demoArt(), title: "Your Ace Card", owner: "You" }); await wait(500); }
    else { staple(style, null); await wait(2400); }
  }
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function loopMoves() {
  for (;;) {
    build();
    const mine = [...f.querySelectorAll(".zone.me.mz")], theirs = [...f.querySelectorAll(".zone.op.mz")].filter((z) => z.firstChild);
    if (kind === "entrance") {
      const z = mine.find((x) => !x.firstChild); z.append(card());
      await wait(300); entrance(style, z, { big: true }); await wait(2200);
    } else {
      const a = mine.find((x) => x.firstChild).firstChild;
      await wait(400); attack(style, a, theirs[1].firstChild); await wait(1900);
    }
  }
}
if (kind === "entrance" || kind === "attack") loopMoves(); else if (kind === "finale" || kind === "ace" || kind === "staple") loopShow(); else loop();
async function loop() {
  for (;;) {
    const sig = build();
    await new Promise((r) => setTimeout(r, 500));
    zoneStrike(style, sig);
    await new Promise((r) => setTimeout(r, 1300));
    await runFinisher({ style, side: "op", mat: f, title: "FINISH!", art: style === "meteor" ? "https://kodex.meiocg.org/img/27204311.jpg" : "" });
    await new Promise((r) => setTimeout(r, 700));
  }
}
</script>
</body>
</html>
