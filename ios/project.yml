# KodeX for iPhone / iPad. Generate the Xcode project with XcodeGen (`xcodegen generate` in this folder) after putting
# the app's files in KodeX/Web (see README.md; the GitHub workflow .github/workflows/ios.yml does all of it).
name: KodeX
options:
  bundleIdPrefix: com.duelsynapse
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "10.4.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  KodeX:
    type: application
    platform: iOS
    sources:
      - path: KodeX
        excludes:
          - "Web"
          - "Web/**"
      - path: KodeX/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: KodeX/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.duelsynapse.kodex
        KX_DISPLAY_NAME: KodeX
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
