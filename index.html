<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kodex — MEIOCG Yu-Gi-Oh! Search</title>
<meta name="description" content="Kodex — fast local Yu-Gi-Oh! card and ruling search for MEIOCG.">
<style>
:root{--bg:#07090d;--panel:#10141b;--panel2:#171d27;--text:#f5f7fb;--muted:#8d98aa;--line:#27303c;--a:#61a8ff;--a2:#8be1ff;--good:#69d39b;--bad:#ff7373}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -15%,#1c2c48 0,#07090d 46%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1280px;margin:auto;padding:30px 16px 70px}.hero{text-align:center;padding:18px 0 8px}.brand{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--a2)}h1{font-size:clamp(38px,7vw,68px);line-height:1;margin:10px 0 9px;letter-spacing:-.045em}.sub{color:var(--muted)}.searchbox{position:sticky;top:10px;z-index:20;margin:24px auto 14px;max-width:980px;padding:9px;display:flex;gap:8px;background:#10141bdd;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 60px #0009;backdrop-filter:blur(18px)}input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:18px;padding:13px 14px}.kbd{align-self:center;color:var(--muted);font-size:11px;border:1px solid var(--line);border-radius:7px;padding:4px 7px}.toolbar{max-width:980px;margin:0 auto 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.select,.chip{background:#111720;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px}.chip{cursor:pointer}.chip.active{color:var(--text);border-color:#4b79a9;background:#17263a}.layout{display:grid;grid-template-columns:minmax(300px,450px) 1fr;gap:16px}.panel{background:#10141bed;border:1px solid var(--line);border-radius:18px;overflow:hidden}.results{height:72vh;overflow:auto}.result{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #202732;cursor:pointer}.result:hover,.result.active{background:var(--panel2)}.thumb{width:50px;height:70px;object-fit:cover;border-radius:6px;background:#080a0e;flex:none}.rname{font-weight:760;line-height:1.25}.rid{font-size:11px;color:var(--muted);margin-top:5px}.rarchetype{font-size:10px;color:var(--a2);margin-top:5px}.detail{min-height:72vh;padding:22px}.empty{text-align:center;color:var(--muted);padding:70px 22px}.cardhead{display:flex;gap:20px}.cardimg{width:190px;max-width:31%;height:auto;object-fit:contain;align-self:flex-start;border-radius:8px}.meta{min-width:0}.meta h2{font-size:29px;line-height:1.12;margin:0 0 9px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:10px;color:var(--muted);margin:2px}.desc{white-space:pre-wrap;color:#d8dde6;line-height:1.55;margin-top:15px}.rulehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:28px 0 10px;border-top:1px solid var(--line);padding-top:20px}.rulehead h3{margin:0}.status{font-size:11px;color:var(--muted)}.qa{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#0c1016;overflow:hidden}.qat{padding:14px 15px;font-weight:760}.qab{padding:0 15px 16px;color:#d9dee7;line-height:1.6;white-space:pre-wrap}.tag{font-size:10px;color:var(--a2);margin-left:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{cursor:pointer;border:1px solid var(--line);background:#151b24;color:#dfe6ef;border-radius:9px;padding:7px 10px;font-size:11px}.btn:hover{border-color:#527ca7}.error{color:var(--bad)}.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:9px}.loading{padding:25px;text-align:center;color:var(--muted)}mark{background:#355b7a;color:white;border-radius:3px;padding:0 2px}@media(max-width:820px){.layout{grid-template-columns:1fr}.results{height:39vh}.detail{min-height:auto}.cardhead{align-items:flex-start}.cardimg{width:125px}.kbd{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div class="brand">MEIOCG DATABASE</div><h1>Kodex</h1><div class="sub">Yu-Gi-Oh! card, ID, archetype & ruling search</div></header>
<div class="searchbox"><input id="q" autocomplete="off" spellcheck="false" placeholder="Search cards, IDs, archetypes…"><span class="kbd">/</span></div>
<div class="toolbar"><button class="chip active" data-filter="all">All</button><button class="chip" data-filter="Monster">Monsters</button><button class="chip" data-filter="Spell">Spells</button><button class="chip" data-filter="Trap">Traps</button><span id="count" class="select">Loading…</span></div>
<main class="layout"><section class="panel results" id="results"><div class="loading">Loading Kodex index…</div></section><section class="panel detail" id="detail"><div class="empty">Search for a card to open its complete MEIOCG entry and available ruling Q&A.</div></section></main>
<div class="hint">Local-first search · card data from the MEIOCG database · ruling data loaded only when a card is opened</div>
</div>
<script>
const INDEX='indexes/search.json';const RULING=id=>`data/rulings/cards/${encodeURIComponent(id)}.json`;let cards=[],selected=null,filter='all',timer=0;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function score(c,q){let x=norm(q);if(!x)return 0;let n=norm(c.name),a=norm(c.archetype),id=String(c.id),k=String(c.konami_id||'');if(n===x)return 100000;if(id===x||k===x)return 95000;if(n.startsWith(x))return 80000-x.length;if(n.includes(x))return 60000-x.length;if(a.includes(x))return 40000-x.length;let ws=x.split(' ').filter(Boolean),hit=ws.filter(w=>n.includes(w)||a.includes(w)).length;if(hit)return 20000+hit*100-ws.length;return 0}
function filtered(){return filter==='all'?cards:cards.filter(c=>String(c.type||'').toLowerCase().includes(filter.toLowerCase()))}
function resultsFor(q){let pool=filtered();if(!q)return pool.slice(0,100);return pool.map(c=>[score(c,q),c]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]||a[1].name.localeCompare(b[1].name)).slice(0,100).map(x=>x[1])}
function highlight(name,q){if(!q)return esc(name);let parts=String(name).split(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'ig'));return parts.map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('')}
function render(list){let q=$('q').value.trim();$('count').textContent=q?`${list.length} matches`:`${cards.length.toLocaleString()} cards`;$('results').innerHTML=list.length?list.map((c,i)=>`<div class="result ${selected?.id===c.id?'active':''}" data-i="${i}"><img class="thumb" loading="lazy" src="${esc(c.image_small||c.image||'')}" onerror="this.style.visibility='hidden'"><div><div class="rname">${highlight(c.name,q)}</div><div class="rid">ID ${esc(c.id)}${c.konami_id?` · Konami DB ${esc(c.konami_id)}`:''}</div>${c.archetype?`<div class="rarchetype">${esc(c.archetype)}</div>`:''}</div></div>`).join(''):'<div class="empty">No matching cards.<br><br>Try a card name, passcode, Konami DB ID, or archetype.</div>';document.querySelectorAll('.result').forEach((el,i)=>el.onclick=()=>openCard(list[i]))}
function search(){clearTimeout(timer);timer=setTimeout(()=>render(resultsFor($('q').value)),25)}
function refs(s){return String(s||'').replace(/<<([0-9]+)>>/g,(_,id)=>{let c=cards.find(x=>String(x.id)===id||String(x.konami_id)===id);return c?c.name:`#${id}`})}
function textOf(x){let e=x?.qaData?.en||{},j=x?.qaData?.ja||{};return{title:e.title||j.title||'',question:e.question||j.question||'',answer:e.answer||j.answer||''}}
async function openCard(c){selected=c;render(resultsFor($('q').value));$('detail').innerHTML=`<div class="cardhead"><img class="cardimg" src="${esc(c.image||'')}" onerror="this.style.display='none'"><div class="meta"><h2>${esc(c.name)}</h2><span class="pill">ID ${esc(c.id)}</span>${c.konami_id?`<span class="pill">Konami DB ${esc(c.konami_id)}</span>`:''}${c.type?`<span class="pill">${esc(c.type)}</span>`:''}${c.archetype?`<span class="pill">${esc(c.archetype)}</span>`:''}<div class="desc">${esc(c.desc||'')}</div><div class="actions"><button class="btn" id="copy">Copy card name</button><button class="btn" id="link">Copy card link</button></div></div></div><div class="rulehead"><h3>Rulings / Q&A</h3><span id="status" class="status">Loading…</span></div><div id="qas"></div>`;$('copy').onclick=()=>navigator.clipboard?.writeText(c.name);$('link').onclick=()=>navigator.clipboard?.writeText(location.href.split('#')[0]+'#card='+encodeURIComponent(c.id));if(!c.konami_id){$('status').textContent='No Konami DB ID in index';return}try{let r=await fetch(RULING(c.konami_id),{cache:'force-cache'});if(!r.ok)throw 0;let d=await r.json();renderQAs(d)}catch(e){$('status').innerHTML='<span class="error">No ruling file available for this card</span>';}}
function renderQAs(d){let rs=Array.isArray(d?.records)?d.records:[];$('status').textContent=`${rs.length} Q&A${rs.length===1?'':'s'}`;$('qas').innerHTML=rs.length?rs.map((r,i)=>{let t=textOf(r.api||r.history);return `<article class="qa"><div class="qat">${esc(refs(t.title||`Q&A #${r.id}`))}<span class="tag">#${esc(r.id)}</span></div><div class="qab"><b>Q:</b> ${esc(refs(t.question))}\n\n<b>A:</b> ${esc(refs(t.answer))}</div></article>`}).join(''):'<div class="empty">No documented Q&A for this card.</div>'}
async function init(){try{let r=await fetch(INDEX,{cache:'force-cache'});if(!r.ok)throw 0;cards=await r.json();render([]);let h=location.hash.match(/^#card=(\d+)$/);if(h){let c=cards.find(x=>String(x.id)===h[1]);if(c)openCard(c)}}catch(e){$('count').textContent='Index unavailable';$('results').innerHTML='<div class="empty">Kodex index is unavailable.<br><br>The database workflow must generate <b>indexes/search.json</b> first.</div>'}}
$('q').addEventListener('input',search);$('q').addEventListener('keydown',e=>{if(e.key==='Escape'){$('q').value='';search()}if(e.key==='Enter'){let r=resultsFor($('q').value)[0];if(r)openCard(r)}});document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}});document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;search()});init();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
