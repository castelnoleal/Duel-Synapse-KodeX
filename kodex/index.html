<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><meta name="application-name" content="Duel Synapse: Kodex"><title>Duel Synapse: Kodex</title><style>:root{--bg:#080a10;--p:#111522;--p2:#171b2a;--line:#2a3143;--t:#eef2ff;--m:#98a3bc;--a:#6aa8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#18223b 0,#080a10 45%);color:var(--t);font:14px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:5;background:#080a10ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px}header h1{font-size:18px;margin:0 0 8px}.sub{color:var(--m)}main{max-width:1000px;margin:auto;padding:12px}.search{display:flex;gap:8px;margin-top:9px}.search input{flex:1;background:#0d111a;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--t);outline:0}.search input:focus{border-color:var(--a)}button{background:var(--p2);border:1px solid var(--line);color:var(--t);border-radius:10px;padding:10px 12px;font-weight:700}.status{color:var(--m);font-size:12px;margin:9px 2px}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}.result{display:flex;gap:10px;padding:10px;background:var(--p);border:1px solid var(--line);border-radius:12px;cursor:pointer}.result:hover{border-color:#628dd0}.thumb{width:54px;height:78px;object-fit:cover;border-radius:5px;background:#080a10}.name{font-weight:800}.meta{font-size:11px;color:var(--m);margin-top:4px}.detail{display:none;background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px}.detail.on{display:block}.hero{display:flex;gap:14px}.hero img{width:120px;max-height:175px;object-fit:cover;border-radius:7px}.hero h2{margin:0 0 5px;font-size:20px}.desc{white-space:pre-wrap;line-height:1.5;color:#dbe2f2;margin-top:12px}.rulings{margin-top:15px}.qa{border-top:1px solid var(--line);padding:12px 0}.qa h3{font-size:14px;margin:0 0 8px}.answer{margin-top:8px;color:#cbd4e7;white-space:pre-wrap;line-height:1.5}.pill{display:inline-block;font-size:10px;color:#a9c9ff;border:1px solid #355b8e;border-radius:20px;padding:3px 7px;margin:2px}.empty{padding:20px;color:var(--m);text-align:center}</style></head><body><header><h1>⚡ Duel Synapse: Kodex</h1><div class="sub">MEIOCG private card + YGOResources Q&A engine</div><div class="search"><input id="q" placeholder="Search any card, passcode, or Konami ID" autocomplete="off"><button id="clear">Clear</button></div><div id="status" class="status">Connecting to private KodeX service…</div></header><main><section id="results" class="results"><div class="empty">Search the MEIOCG KodeX database.</div></section><section id="detail" class="detail"></section></main><script>const API=location.origin+'/api',SEARCH=API+'/search',RUL=id=>API+'/ruling/'+encodeURIComponent(id);let timer=0,requestSeq=0,currentResults=[];const $=id=>document.getElementById(id),q=$('q'),results=$('results'),detail=$('detail'),status=$('status');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderResults(list){currentResults=list||[];results.style.display='grid';detail.classList.remove('on');detail.innerHTML='';if(!currentResults.length){results.innerHTML='<div class="empty">No cards found.</div>';return}results.innerHTML=currentResults.map((c,i)=>`<article class="result" data-i="${i}"><img class="thumb" loading="lazy" src="${esc(c.image_small||c.image||'')}" onerror="this.style.visibility='hidden'"><div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.type||'')} ${c.konami_id?`• Konami ${esc(c.konami_id)}`:''}</div>${c.archetype?`<div class="meta">${esc(c.archetype)}</div>`:''}</div></article>`).join('');results.querySelectorAll('.result').forEach(el=>el.onclick=()=>openCard(currentResults[Number(el.dataset.i)]))}async function search(){const term=q.value.trim();const seq=++requestSeq;if(!term){currentResults=[];results.innerHTML='<div class="empty">Search the MEIOCG KodeX database.</div>';status.textContent='Private KodeX service ready';return}status.textContent='Searching private KodeX…';try{const r=await fetch(`${SEARCH}?q=${encodeURIComponent(term)}&limit=80`,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(seq!==requestSeq)return;const list=Array.isArray(data.results)?data.results:[];status.textContent=`Private KodeX search • ${Number(data.count??list.length).toLocaleString()} matches`;renderResults(list)}catch(e){if(seq!==requestSeq)return;status.textContent='KodeX service unavailable';results.innerHTML='<div class="empty">Unable to reach the private KodeX service.<br><br>Please try again.</div>'}}async function openCard(c){if(!c)return;results.style.display='none';detail.classList.add('on');detail.innerHTML=`<button id="back">← Back</button><div class="hero" style="margin-top:12px"><img src="${esc(c.image||c.image_small||'')}" onerror="this.style.display='none'"><div><h2>${esc(c.name)}</h2><span class="pill">${esc(c.type||'')}</span>${c.archetype?`<span class="pill">${esc(c.archetype)}</span>`:''}<div class="meta">Passcode: ${esc(c.id)}${c.konami_id?` • Konami DB ID: ${esc(c.konami_id)}`:''}</div></div></div><div class="desc">${esc(c.desc||'')}</div><div class="rulings"><h2>Rulings / Q&A</h2><div id="qa"><div class="empty">Retrieving complete MEIOCG Q&A set…</div></div></div>`;$('back').onclick=()=>{detail.classList.remove('on');detail.innerHTML='';results.style.display='grid'};loadRulings(c)}async function loadRulings(c){const id=c.konami_id;if(!id){$('qa').innerHTML='<div class="empty">No Konami database ID is mapped for this card.</div>';return}const key='kodex:ruling:'+id;let data=null;try{data=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(data)renderRulings(data);try{const r=await fetch(RUL(id),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const fresh=await r.json();try{localStorage.setItem(key,JSON.stringify(fresh))}catch(e){}if(!data||JSON.stringify(fresh)!==JSON.stringify(data))renderRulings(fresh)}catch(e){if(!data)$('qa').innerHTML='<div class="empty">MEIOCG ruling aggregate unavailable.</div>'}}function renderRulings(data){const rows=(data.records||[]).map(r=>{const en=r?.api?.qaData?.en||{};return{id:en.id||r.id,title:en.title||'',q:en.question||'',a:en.answer||''}}).filter(x=>x.title||x.q||x.a);$('qa').innerHTML=rows.length?`<div class="status">${rows.length.toLocaleString()} Q&A records • private aggregate request</div>`+rows.map(x=>`<article class="qa"><h3>${esc(x.title||'Q&A #'+x.id)}</h3>${x.q?`<div>${esc(x.q)}</div>`:''}${x.a?`<div class="answer"><b>A:</b> ${esc(x.a)}</div>`:''}</article>`).join(''):'<div class="empty">No documented Q&A records for this card.</div>'}q.oninput=()=>{clearTimeout(timer);timer=setTimeout(search,180)};$('clear').onclick=()=>{q.value='';search();q.focus()};document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}if(e.key==='Escape'){q.value='';search()}});(async()=>{try{const r=await fetch(API+'/health',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);status.textContent='Private KodeX service ready'}catch(e){status.textContent='Private KodeX service not connected'}})();</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});</script></body></html>
