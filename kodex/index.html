<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Duel Synapse: Kodex</title><style>:root{--bg:#080a10;--p:#111522;--p2:#171b2a;--line:#2a3143;--t:#eef2ff;--m:#98a3bc;--a:#6aa8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#18223b 0,#080a10 45%);color:var(--t);font:14px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:5;background:#080a10ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px}header h1{font-size:18px;margin:0 0 8px}header small{color:var(--m)}main{max-width:1000px;margin:auto;padding:12px}.search{display:flex;gap:8px}.search input{flex:1;background:#0d111a;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--t);outline:0}.search input:focus{border-color:var(--a)}button{background:var(--p2);border:1px solid var(--line);color:var(--t);border-radius:10px;padding:10px 12px;font-weight:700}.status{color:var(--m);font-size:12px;margin:9px 2px}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}.result{display:flex;gap:10px;padding:10px;background:var(--p);border:1px solid var(--line);border-radius:12px;cursor:pointer}.result:hover{border-color:#628dd0}.thumb{width:54px;height:78px;object-fit:cover;border-radius:5px;background:#080a10}.name{font-weight:800}.meta{font-size:11px;color:var(--m);margin-top:4px}.detail{display:none;background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px}.detail.on{display:block}.hero{display:flex;gap:14px}.hero img{width:120px;max-height:175px;object-fit:cover;border-radius:7px}.hero h2{margin:0 0 5px;font-size:20px}.desc{white-space:pre-wrap;line-height:1.5;color:#dbe2f2;margin-top:12px}.rulings{margin-top:15px}.qa{border-top:1px solid var(--line);padding:12px 0}.qa h3{font-size:14px;margin:0 0 8px}.qa q{display:block}.answer{margin-top:8px;color:#cbd4e7;white-space:pre-wrap;line-height:1.5}.pill{display:inline-block;font-size:10px;color:#a9c9ff;border:1px solid #355b8e;border-radius:20px;padding:3px 7px;margin:2px}.empty{padding:20px;color:var(--m);text-align:center}</style></head><body><header><h1>⚡ Duel Synapse: Kodex</h1><small>MEIOCG mirrored card + YGOResources Q&A engine</small><div class="search"><input id="q" placeholder="Search any card, passcode, or Konami ID" autocomplete="off"><button id="clear">Clear</button></div><div id="status" class="status">Starting local search…</div></header><main><section id="results" class="results"></section><section id="detail" class="detail"></section></main><script>const BASE=location.origin,IDX=BASE+'/indexes/search.json',RUL=BASE+'/data/rulings/cards/';let cards=[],timer=0;const $=id=>document.getElementById(id),q=$('q'),results=$('results'),detail=$('detail'),status=$('status');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s??'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').trim();async function getIndex(){let c=JSON.parse(localStorage.getItem('kodex:index')||'null');if(Array.isArray(c)&&c.length){cards=c;return c}let r=await fetch(IDX,{cache:'no-cache'});if(!r.ok)throw Error('MEIOCG search index unavailable');c=await r.json();if(!Array.isArray(c)||!c.length)throw Error('MEIOCG search index is empty');localStorage.setItem('kodex:index',JSON.stringify(c));cards=c;return c}function search(){const term=norm(q.value);if(!term){results.innerHTML='<div class="empty">Search the MEIOCG mirror database.</div>';return}const parts=term.split(/\s+/).filter(Boolean);const out=cards.map(c=>{const hay=norm([c.name,c.id,c.konami_id,c.archetype,c.type].join(' '));let score=0;if(norm(c.name)===term)score+=10000;if(norm(c.name).startsWith(term))score+=5000;if(hay.includes(term))score+=1000;score+=parts.filter(x=>hay.includes(x)).length*100;return [score,c]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,80).map(x=>x[1]);results.innerHTML=out.length?out.map(c=>`<article class="result" data-id="${esc(c.id)}"><img class="thumb" loading="lazy" src="${esc(c.image_small||c.image||'')}" onerror="this.style.visibility='hidden'"><div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.type||'')} ${c.konami_id?`• Konami ${esc(c.konami_id)}`:''}</div>${c.archetype?`<div class="meta">${esc(c.archetype)}</div>`:''}</div></article>`).join(''):'<div class="empty">No cards found.</div>';results.querySelectorAll('.result').forEach(el=>el.onclick=()=>openCard(el.dataset.id))}async function openCard(id){const c=cards.find(x=>String(x.id)===String(id));if(!c)return;results.style.display='none';detail.classList.add('on');detail.innerHTML=`<button id="back">← Back</button><div class="hero" style="margin-top:12px"><img src="${esc(c.image||c.image_small||'')}"><div><h2>${esc(c.name)}</h2><span class="pill">${esc(c.type||'')}</span>${c.archetype?`<span class="pill">${esc(c.archetype)}</span>`:''}<div class="meta">Passcode: ${esc(c.id)}${c.konami_id?` • Konami DB ID: ${esc(c.konami_id)}`:''}</div></div></div><div class="desc">${esc(c.desc||'')}</div><div class="rulings"><h2>Rulings / Q&A</h2><div id="qa"><div class="empty">Loading one MEIOCG aggregate…</div></div></div>`;$('back').onclick=()=>{detail.classList.remove('on');detail.innerHTML='';results.style.display='grid';search()};await loadRulings(c)}async function loadRulings(c){const id=c.konami_id;if(!id){$('qa').innerHTML='<div class="empty">No Konami database ID is mapped for this card.</div>';return}const key='kodex:ruling:'+id;let data=JSON.parse(localStorage.getItem(key)||'null');try{if(!data){const r=await fetch(RUL+encodeURIComponent(id)+'.json',{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();localStorage.setItem(key,JSON.stringify(data))}}catch(e){if(!data){$('qa').innerHTML='<div class="empty">MEIOCG ruling aggregate unavailable.</div>';return}}const rows=(data.records||[]).map(r=>{const en=r?.api?.qaData?.en||{};return {id:en.id||r.id,title:en.title||'',q:en.question||'',a:en.answer||''}}).filter(x=>x.title||x.q||x.a);$('qa').innerHTML=rows.length?`<div class="status">${rows.length.toLocaleString()} Q&A records • one aggregate request</div>`+rows.map(x=>`<article class="qa"><h3>${esc(x.title||'Q&A #'+x.id)}</h3>${x.q?`<q>${esc(x.q)}</q>`:''}${x.a?`<div class="answer"><b>A:</b> ${esc(x.a)}</div>`:''}</article>`).join(''):'<div class="empty">No documented Q&A records for this card.</div>'}q.oninput=()=>{clearTimeout(timer);timer=setTimeout(search,30)};$('clear').onclick=()=>{q.value='';search();q.focus()};document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}if(e.key==='Escape'){q.value='';search()}});(async()=>{try{await getIndex();status.textContent=`MEIOCG fast index ready • ${cards.length.toLocaleString()} cards`;search()}catch(e){status.textContent=e.message;results.innerHTML='<div class="empty">MEIOCG database is not ready yet.</div>'}})();</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});</script></body></html>
