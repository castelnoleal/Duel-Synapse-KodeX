name: Update Q&A Card Name Index

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MEIOCG repository
        uses: actions/checkout@v6

      - name: Build MEIOCG card-name → Konami-ID index
        run: |
          python3 <<'PY'
          import json, urllib.request
          from pathlib import Path

          url = 'https://db.ygoresources.com/data/idx/card/name/en'
          req = urllib.request.Request(url, headers={'User-Agent':'MEIOCG-Kodex-Name-Index/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.loads(r.read())

          out = {}
          for name, ids in data.items():
              if not name or not isinstance(ids, list):
                  continue
              clean = [int(x) for x in ids if str(x).isdigit()]
              if clean:
                  out[name] = clean

          path = Path('data/rulings/card-name-index.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print(f'Indexed {len(out)} English card names')
          PY

      - name: Commit only if changed
        run: |
          git config user.name 'MEIOCG Database Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rulings/card-name-index.json
          if git diff --cached --quiet; then
            echo 'No name-index changes.'
          else
            git commit -m 'Update Q&A card name index'
            # Other data jobs may have pushed meanwhile: rebase onto them and retry.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              [ "$i" = 5 ] && exit 1
              sleep $((i * 5))
              git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            done
          fi
