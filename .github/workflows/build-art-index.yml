name: Build card art index

# Fingerprints every card's artwork for the KodeX app's card scanner (scan/art.json).
# Runs weekly and when the card database changes; downloaded artworks are cached,
# so later runs only fetch new cards.
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 2'
  push:
    paths:
      - 'scripts/build_art_index.py'
      - 'scan/arthash.js'
      - '.github/workflows/build-art-index.yml'

permissions:
  contents: write

concurrency:
  group: art-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - name: Restore downloaded artworks
        uses: actions/cache@v4
        with:
          path: .art-cache
          key: art-cache-${{ github.run_id }}
          restore-keys: art-cache-
      - name: Build art index
        run: python3 scripts/build_art_index.py --workers 12
      - name: Publish art index
        run: |
          git config user.name 'MEIOCG Database Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scan/art.json
          if git diff --cached --quiet; then echo 'No art index changes.'; exit 0; fi
          git commit -m 'Build card art index'
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            [ "$i" = 5 ] && exit 1
            sleep $((i * 5))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
