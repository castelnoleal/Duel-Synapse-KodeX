name: Update MEIOCG Database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-database.yml'

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build card database and fast search indexes
        shell: python
        run: |
          import json, re, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          API="https://db.ygoprodeck.com/api/v7/cardinfo.php?misc=yes"
          VER="https://db.ygoprodeck.com/api/v7/checkDBVer.php"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"MEIOCG-Database-Updater/3.0"})
              with urllib.request.urlopen(req,timeout=180) as r:return json.loads(r.read())
          def norm(s):return re.sub(r"\s+"," ",(s or "").strip().lower())
          def konami_id(card):
              misc=card.get("misc_info") or []
              if isinstance(misc,list):misc=misc[0] if misc else {}
              if isinstance(misc,dict):
                  v=misc.get("konami_id")
                  if v not in (None,""):
                      try:return int(v)
                      except:pass
              for key in ("konami_id","konamiId","konamiID","konami_db_id","konami_database_id"):
                  v=card.get(key)
                  if v not in (None,""):
                      try:return int(v)
                      except:pass
              return None
          data=Path("data");idx=Path("indexes");data.mkdir(exist_ok=True);idx.mkdir(exist_ok=True)
          version=get(VER);cards=get(API).get("data",[])
          if not cards:raise SystemExit("No cards returned; update aborted.")
          (data/"cards.json").write_text(json.dumps(cards,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          (data/"cards.min.json").write_text(json.dumps(cards,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          names={};ids={};archetypes={};types={};search=[]
          for c in cards:
              cid=c["id"];name=c.get("name","");k=konami_id(c);ids[str(cid)]={"id":cid,"name":name,"konami_id":k};n=norm(name)
              if n:names.setdefault(n,[]).append(cid)
              a=c.get("archetype");t=c.get("type")
              if a:archetypes.setdefault(a,[]).append(cid)
              if t:types.setdefault(t,[]).append(cid)
              imgs=c.get("card_images") or [];im=imgs[0] if imgs and isinstance(imgs[0],dict) else {}
              search.append({"id":cid,"name":name,"konami_id":k,"type":t or "","desc":c.get("desc",""),"race":c.get("race",""),"attribute":c.get("attribute",""),"level":c.get("level"),"rank":c.get("rank"),"linkval":c.get("linkval"),"image":im.get("image_url",""),"image_small":im.get("image_url_small",im.get("image_url","")),"archetype":a or ""})
          if len(search)<10000:raise SystemExit(f"Search index unexpectedly small: {len(search)}")
          if not any(c.get("name")=="Ash Blossom & Joyous Spring" and c.get("konami_id") for c in search):raise SystemExit("Ash Blossom Konami ID validation failed")
          search.sort(key=lambda x:norm(x["name"]))
          (idx/"search.json").write_text(json.dumps(search,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          for fn,obj in [("name.json",names),("id.json",ids),("archetype.json",archetypes),("type.json",types)]: (idx/fn).write_text(json.dumps(obj,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          (data/"metadata.json").write_text(json.dumps({"database":"MEIOCG-Database","schema_version":3,"status":"populated","last_import_utc":datetime.now(timezone.utc).isoformat(),"source":{"name":"YGOPRODeck card data + YGOResources Q&A mirror","api_version":"v7","database_version":version},"card_count":len(cards),"search_count":len(search)},ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"Built MEIOCG database: {len(cards)} cards; search index: {len(search)}")
      - name: Commit generated database
        run: |
          git config user.name "MEIOCG Database Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json data/cards.min.json data/metadata.json indexes/
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Build MEIOCG card mirror and fast search index"; git push; fi
