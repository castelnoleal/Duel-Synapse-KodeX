name: Update MEIOCG Database

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update database
        run: python scripts/update_database.py

      - name: Commit changes
        run: |
          git config user.name "MEIOCG Database Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ indexes/
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Update MEIOCG card database"
            # Other data jobs may have pushed meanwhile: rebase onto them and retry.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              [ "$i" = 5 ] && exit 1
              sleep $((i * 5))
              git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            done
          fi
