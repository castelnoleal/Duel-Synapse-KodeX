name: Deploy MEIOCG price relay

# Small separate Worker (price-relay/) used by castelnoleal/Meiocg_Price-Check to read Yuyu-tei.
# Does not touch the KodeX Worker. Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets.
on:
  push:
    branches: ["main"]
    paths: ["price-relay/**", ".github/workflows/deploy-price-relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Deploy
        working-directory: price-relay
        run: |
          npx --yes wrangler@4.127.1 deploy > deploy.log 2>&1 && ok=1 || ok=0
          cat deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "::notice title=relay url::${URL:-not found}"
          if [ "$ok" != 1 ]; then echo "::error title=deploy failed::$(tail -c 1200 deploy.log | tr '\n' ' ')"; exit 1; fi
          if [ -n "$URL" ]; then
            sleep 15
            code=$(curl -s -o /tmp/b -w '%{http_code}' "$URL/?url=https%3A%2F%2Fyuyu-tei.jp%2Ftop%2Fygo")
            echo "::notice title=yuyu-tei via relay::HTTP $code, $(wc -c < /tmp/b) bytes, $(grep -o '/sell/ygo/s/[a-z0-9]*' /tmp/b | sort -u | wc -l) set links"
          fi
