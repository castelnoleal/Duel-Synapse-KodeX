name: Sync YGOResources Q&A Database (Fast Mirror)

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-ygoresources-qa
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MEIOCG repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Clone complete parent Q&A history
        run: |
          rm -rf /tmp/yugioh-qa-history
          git clone --depth 1 --single-branch --branch main \
            https://github.com/db-ygoresources-com/yugioh-qa-history.git \
            /tmp/yugioh-qa-history

      - name: Sync complete parent history
        run: |
          mkdir -p data/rulings/yugioh-qa-history
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/yugioh-qa-history/ \
            data/rulings/yugioh-qa-history/

      - name: Build validated one-request-per-card MEIOCG ruling mirror
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import re
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          ROOT = Path("data/rulings")
          HISTORY = ROOT / "yugioh-qa-history"
          QA_CACHE = ROOT / "qa-api-cache"
          CARD_DIR = ROOT / "cards"
          QA_CACHE.mkdir(parents=True, exist_ok=True)
          CARD_DIR.mkdir(parents=True, exist_ok=True)

          API = "https://db.ygoresources.com"
          UA = "MEIOCG-Kodex-Ruling-Mirror/3.0"
          META = ROOT / "mirror-metadata.json"

          def get_json(url, timeout=45):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "application/json"
              })
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read())

          def norm_key(k):
              return re.sub(r"[^a-z0-9]", "", str(k).lower())

          def numeric_id(v):
              if isinstance(v, bool):
                  return None
              if isinstance(v, int):
                  return str(v) if v > 0 else None
              if isinstance(v, float) and v.is_integer():
                  return str(int(v))
              if isinstance(v, str) and re.fullmatch(r"\d{3,}", v.strip()):
                  return v.strip()
              return None

          def extract_ids(value):
              out = set()
              one = numeric_id(value)
              if one:
                  out.add(one)
              elif isinstance(value, list):
                  for item in value:
                      out |= extract_ids(item)
              elif isinstance(value, dict):
                  # Prefer explicit ID fields inside card objects.
                  for k, v in value.items():
                      nk = norm_key(k)
                      if nk in {
                          "id", "cardid", "card_id", "konamiid",
                          "konamifid", "databaseid", "cid"
                      }:
                          one = numeric_id(v)
                          if one:
                              out.add(one)
                  # If no explicit ID was found, inspect nested values.
                  if not out:
                      for v in value.values():
                          out |= extract_ids(v)
              return out

          # The parent history format has changed over time. Do not assume that
          # card associations are called only "mentionedCards".
          CARD_KEYS = {
              "cards", "card", "cardid", "cardids", "card_id", "card_ids",
              "mentionedcards", "mentionedcardids",
              "relatedcards", "relatedcardids",
              "cardsmentioned", "referencedcards", "referencedcardids"
          }

          def mentioned_cards(obj):
              out = set()
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      nk = norm_key(k)
                      if nk in {norm_key(x) for x in CARD_KEYS}:
                          out |= extract_ids(v)
                      # Also accept keys whose normalized form clearly describes
                      # a card-id collection, but never blindly scrape every number.
                      if ("card" in nk and ("id" in nk or nk.endswith("cards"))) and nk not in {"cardtext", "cardname"}:
                          out |= extract_ids(v)
                      if isinstance(v, (dict, list)):
                          out |= mentioned_cards(v)
              elif isinstance(obj, list):
                  for x in obj:
                      out |= mentioned_cards(x)
              return out

          qa_files = sorted(
              [p for p in HISTORY.glob("*.json") if p.stem.isdigit()],
              key=lambda p: int(p.stem)
          )

          qa_objects = {}
          relationships = {}

          for path in qa_files:
              try:
                  obj = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              qid = path.stem
              cards = mentioned_cards(obj)
              if cards:
                  qa_objects[qid] = obj
                  for cid in cards:
                      relationships.setdefault(cid, set()).add(qid)

          # Some parent revisions expose the card association only through the
          # YGOResources card endpoint. If the history format did not expose any
          # relationships, build them from the authoritative card API instead.
          if not relationships:
              print("History files did not expose card relationships; using YGOResources card API.")
              card_candidates = []
              cards_json = Path("data/cards.json")
              if cards_json.exists():
                  try:
                      card_data = json.loads(cards_json.read_text(encoding="utf-8"))
                      card_candidates = card_data if isinstance(card_data, list) else card_data.get("data", [])
                  except Exception:
                      card_candidates = []

              def card_db_id(c):
                  if not isinstance(c, dict):
                      return None
                  misc = c.get("misc_info")
                  misc = misc[0] if isinstance(misc, list) and misc else misc
                  for obj in (c, misc or {}):
                      if isinstance(obj, dict):
                          for k in ("konami_id", "konamiId", "konamiID", "konami_db_id", "konami_database_id"):
                              v = numeric_id(obj.get(k))
                              if v:
                                  return v
                  return None

              card_ids = sorted({x for x in (card_db_id(c) for c in card_candidates) if x}, key=int)

              def get_card_qas(cid):
                  try:
                      data = get_json(f"{API}/data/card/{cid}")
                      found = set()

                      def walk(node, qa_context=False):
                          if isinstance(node, dict):
                              for k, v in node.items():
                                  nk = norm_key(k)
                                  ctx = qa_context or ("qa" in nk or "faq" in nk or "question" in nk)
                                  if ctx:
                                      # Only take explicit Q&A identifiers.
                                      if nk in {
                                          "id", "qaid", "qa_id", "faqid", "faq_id",
                                          "fid", "questionid", "question_id"
                                      }:
                                          one = numeric_id(v)
                                          if one:
                                              found.add(one)
                                      elif isinstance(v, (dict, list)):
                                          walk(v, True)
                                  elif isinstance(v, (dict, list)):
                                      walk(v, False)
                          elif isinstance(node, list):
                              for x in node:
                                  walk(x, qa_context)

                      walk(data)
                      return cid, found
                  except Exception as e:
                      print(f"WARN card {cid}: {e}")
                      return cid, set()

              with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
                  for i, (cid, qids_for_card) in enumerate(ex.map(get_card_qas, card_ids), 1):
                      if qids_for_card:
                          relationships[cid] = qids_for_card
                      if i % 250 == 0:
                          print(f"Card/Q&A association scan: {i}/{len(card_ids)}")

              # Load the history objects needed by the resulting relationships.
              needed = {qid for qs in relationships.values() for qid in qs}
              for qid in needed:
                  p = HISTORY / f"{qid}.json"
                  if p.exists():
                      try:
                          qa_objects[qid] = json.loads(p.read_text(encoding="utf-8"))
                      except Exception:
                          pass

          if not relationships:
              raise SystemExit(
                  "ERROR: No card→Q&A relationships were discovered. "
                  "Refusing to publish an empty fast mirror."
              )

          # Cache upstream Q&A API records. Existing cache entries are reused
          # when the corresponding history file has not changed.
          previous_meta = {}
          if META.exists():
              try:
                  previous_meta = json.loads(META.read_text(encoding="utf-8"))
              except Exception:
                  pass

          qids = sorted({qid for qs in relationships.values() for qid in qs}, key=int)
          history_hash = {}
          for qid in qids:
              p = HISTORY / f"{qid}.json"
              history_hash[qid] = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else ""

          def fetch_one(qid):
              dest = QA_CACHE / f"{qid}.json"
              if dest.exists() and dest.stat().st_size > 2:
                  try:
                      cached = json.loads(dest.read_text(encoding="utf-8"))
                      if cached.get("_meiocg_history_sha") == history_hash[qid]:
                          return qid, "cached"
                  except Exception:
                      pass
              try:
                  data = get_json(f"{API}/data/qa/{qid}")
                  if isinstance(data, dict):
                      data["_meiocg_history_sha"] = history_hash[qid]
                  dest.write_text(
                      json.dumps(data, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8"
                  )
                  return qid, "fetched"
              except Exception as e:
                  print(f"WARN Q&A {qid}: {e}")
                  return qid, "failed"

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              for i, (qid, mode) in enumerate(ex.map(fetch_one, qids), 1):
                  if i % 250 == 0:
                      print(f"Q&A cache: {i}/{len(qids)}")

          def load_api(qid):
              p = QA_CACHE / f"{qid}.json"
              if p.exists():
                  try:
                      return json.loads(p.read_text(encoding="utf-8"))
                  except Exception:
                      pass
              return None

          # One aggregate per YGOResources database card ID.
          for cid, qids_for_card in relationships.items():
              records = []
              for qid in sorted(qids_for_card, key=int):
                  records.append({
                      "id": int(qid),
                      "history": qa_objects.get(qid),
                      "api": load_api(qid)
                  })
              payload = {
                  "schema": 3,
                  "cardId": int(cid),
                  "count": len(records),
                  "source": "YGOResources + db-ygoresources-com/yugioh-qa-history",
                  "records": records
              }
              (CARD_DIR / f"{cid}.json").write_text(
                  json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8"
              )

          (ROOT / "card-index.json").write_text(
              json.dumps(
                  {cid: sorted(map(int, qs)) for cid, qs in relationships.items()},
                  ensure_ascii=False,
                  separators=(",", ":")
              ),
              encoding="utf-8"
          )

          meta = {
              "schema": 4,
              "cards": len(relationships),
              "qas": len(qids),
              "api_cache_files": len(list(QA_CACHE.glob("*.json"))),
              "parent": "https://github.com/db-ygoresources-com/yugioh-qa-history",
              "api": API,
              "generated_utc": datetime.now(timezone.utc).isoformat()
          }
          (ROOT / "mirror-metadata.json").write_text(
              json.dumps(meta, indent=2), encoding="utf-8"
          )

          print(f"SUCCESS: built {len(relationships)} card aggregates from {len(qids)} Q&As")
          PY

      - name: Validate fast mirror before publishing
        run: |
          test -s data/rulings/card-index.json
          test -s data/rulings/mirror-metadata.json
          COUNT="$(find data/rulings/cards -maxdepth 1 -type f -name '*.json' | wc -l)"
          echo "Generated card aggregates: $COUNT"
          test "$COUNT" -gt 0

      - name: Record upstream revision
        run: |
          UPSTREAM_SHA="$(git -C /tmp/yugioh-qa-history rev-parse HEAD)"
          UPSTREAM_DATE="$(git -C /tmp/yugioh-qa-history log -1 --format=%cI)"
          cat > data/rulings/upstream.json <<EOF
          {
            "database": "MEIOCG YGOResources Q&A History",
            "upstream": "https://github.com/db-ygoresources-com/yugioh-qa-history",
            "branch": "main",
            "upstream_commit": "$UPSTREAM_SHA",
            "upstream_commit_date": "$UPSTREAM_DATE",
            "synced_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit mirror only when it changed
        run: |
          git config user.name "MEIOCG Database Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rulings/
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Build MEIOCG fast Q&A mirror"
            # Other data jobs may have pushed meanwhile: rebase onto them and retry.
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              [ "$i" = 5 ] && exit 1
              sleep $((i * 5))
              git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            done
          fi
