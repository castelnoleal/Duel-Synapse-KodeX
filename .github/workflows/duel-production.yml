name: Duel Arena production check

on:
  push:
    branches: ["main"]
    paths: ["duel/**", "server/**", "wrangler.json", "tests/duel/**", ".github/workflows/duel-production.yml"]
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read

concurrency:
  group: duel-production-check
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: https://kodex.meiocg.org
    steps:
      - uses: actions/checkout@v4

      - name: Wait for this commit's Arena to be live
        run: |
          want=$(sha256sum duel/app.js | cut -d' ' -f1)
          for i in $(seq 1 30); do
            got=$(curl -fsS "$BASE/duel/app.js?ci=$GITHUB_SHA-$i" | sha256sum | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then echo "Arena is serving this commit."; exit 0; fi
            echo "Waiting for deployment ($i/30)..."; sleep 20
          done
          echo "::error::$BASE/duel/app.js does not match this commit after 10 minutes."; exit 1

      - name: Check Arena endpoints
        run: |
          set -e
          commit=$(node -e "console.log(require('./duel/data/scripts.json').commit)")
          check() { # url expected-content-type-prefix
            code=$(curl -sS -o /tmp/body -w '%{http_code} %{content_type}' "$1")
            echo "$1 -> $code"
            case "$code" in "200 $2"*) ;; *) echo "::error::$1 returned '$code'"; exit 1;; esac
          }
          check "$BASE/duel/" "text/html"
          check "$BASE/duel/source.html" "text/html"
          check "$BASE/duel/engine/ocgcore.wasm" "application/wasm"
          check "$BASE/duel/engine/build/kx_shim.cpp" "text/plain"
          check "$BASE/duel/data/cards.json" "application/json"
          check "$BASE/duel/scripts/$commit/utility.lua" "text/plain"
          check "$BASE/duel/scripts/$commit/official/c46986414.lua" "text/plain"
          check "$BASE/img/89631139.jpg" "image/jpeg"
          # The room endpoint must demand a WebSocket upgrade (426), proving the Durable Object is bound.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/duel/room/CITEST?role=host&name=CI")
          echo "room endpoint -> $code"
          [ "$code" = "426" ] || { echo "::error::Room endpoint returned $code (expected 426)."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Live solo playtest in the browser
        run: |
          node tests/duel/ui-solo.mjs "$BASE" . > ui-solo.log 2>&1 && ok=1 || ok=0
          cat ui-solo.log
          if [ "$ok" != 1 ]; then echo "::error title=ui-solo::$(tail -c 1200 ui-solo.log | tr '\n' ' ')"; exit 1; fi

      - name: Live online duel (host, guest and spectator through the Durable Object)
        run: |
          node tests/duel/ui-online.mjs "$BASE" . > ui-online.log 2>&1 && ok=1 || ok=0
          cat ui-online.log
          if [ "$ok" != 1 ]; then echo "::error title=ui-online::$(tail -c 1200 ui-online.log | tr '\n' ' ')"; exit 1; fi

      - name: Card art loads in the Arena
        run: |
          node tests/duel/ui-images.mjs "$BASE" . > ui-images.log 2>&1 && ok=1 || ok=0
          cat ui-images.log
          if [ "$ok" != 1 ]; then echo "::error title=ui-images::$(tail -c 1200 ui-images.log | tr '\n' ' ')"; exit 1; fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-screenshots
          path: "*.png"
          if-no-files-found: ignore
